<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>十枚目</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:#d9d4c6}
#gl{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#subs,#opsubs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sub{position:absolute;writing-mode:vertical-rl;white-space:nowrap;color:#e4dfd0;transition:opacity .5s linear}
.sub span{display:inline-block;opacity:0;will-change:transform,opacity}
.dots{position:relative;-webkit-text-fill-color:transparent}
.dots::before{content:"";position:absolute;left:50%;top:.14em;width:.13em;height:.13em;margin-left:-.065em;border-radius:50%;background:currentColor;box-shadow:0 .3em 0 currentColor,0 .6em 0 currentColor}
.l1{right:14%;top:15%;font-size:clamp(15px,calc(1.5vmin + 1.1vh),25px);font-weight:500;letter-spacing:.62em;filter:url(#ink1)}
.l2{right:29%;top:24%;font-size:clamp(20px,calc(2.2vmin + 1.5vh),36px);font-weight:600;letter-spacing:.4em;filter:url(#ink1)}
.l3{right:5%;top:2.5vh;font-size:min(10.6vh,27vw);font-weight:800;line-height:1;letter-spacing:0;color:#f1ebdb;filter:url(#ink3);transition:none}
.l3 span{transform-origin:50% 0}
.l3.split span{text-shadow:-.035em 0 0 rgba(168,22,34,.9),.03em 0 0 rgba(28,96,104,.75)}
.l3 .bang{text-combine-upright:all;-webkit-text-combine:horizontal;font-size:.62em;margin-top:.9em;letter-spacing:-.05em}
#opsubs{writing-mode:vertical-rl;padding:9vh 9vw 0 0;font-size:clamp(14px,calc(1.3vmin + 1vh),22px);letter-spacing:.5em;font-weight:500;color:#e2dccd;filter:url(#ink1)}
#opsubs div{margin-left:.85em;opacity:0}
#opmiss{position:fixed;left:11%;top:24%;writing-mode:vertical-rl;pointer-events:none;opacity:0;font-size:clamp(24px,calc(2.6vmin + 1.7vh),40px);font-weight:600;letter-spacing:.34em;color:#ece6d6;filter:url(#ink1)}
#opmiss>span{display:block;margin-left:.55em}
#bigtitle{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#bigtitle b,#title .t{writing-mode:vertical-rl;font-size:min(13vh,22vw);letter-spacing:.34em;font-weight:800;color:#ece6d6;filter:url(#ink3)}
#count,#hint{position:fixed;writing-mode:vertical-rl;pointer-events:none;opacity:0;white-space:nowrap;filter:url(#ink1)}
#count{font-size:16px;letter-spacing:.42em;color:#d6dfdd;transform:translate(-50%,-50%);font-weight:600;text-shadow:0 0 6px #000}#count.chase{color:#ef8f7e}
#fearfx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(110,0,0,.5) 78%,rgba(70,0,0,.85) 100%)}
body:not([data-mode="play"]) #fearfx{display:none}
#hint{right:11%;top:13%;font-size:clamp(15px,calc(1.4vmin + 1.05vh),23px);letter-spacing:.42em;font-weight:500;color:#e6e0d0}
#slit{position:fixed;inset:0;pointer-events:none;display:none}
#slit.on{display:block}
#slit i{position:absolute;top:0;bottom:0;background:#000;box-shadow:0 0 4vw 2.2vw #000}
#slit i:first-child{left:0;width:37%}#slit i:last-child{right:0;width:37%}
#stam{position:fixed;left:13px;top:54%;width:3px;height:20vh;margin-top:-10vh;background:rgba(217,212,198,.14)}
#stam b{position:absolute;left:0;right:0;bottom:0;background:#d9d4c6;opacity:.75}
#stam.low b{background:#b03a34;animation:bl .32s steps(2) infinite}#stam.gone{opacity:.25}
@keyframes bl{50%{opacity:.25}}
#stam::after{content:"皿";position:absolute;left:-5px;top:-22px;font-size:12px;opacity:.55}
#stam.gone::after{content:"割";color:#b03a34;opacity:1}
#keyIcon{position:fixed;left:8px;top:calc(50% + 12vh);font-size:13px;border:1px solid rgba(217,212,198,.5);padding:3px 2px;writing-mode:vertical-rl;opacity:0;color:#e3c46a;border-color:#8d7230}
#keyIcon.on{opacity:.9}
#joy{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border:1px solid rgba(217,212,198,.2);border-radius:50%;display:none;pointer-events:none}
#joy.on{display:block}#joy i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:rgba(217,212,198,.22)}
button{font:inherit;color:#d9d4c6;background:rgba(0,0,0,.45);border:1px solid rgba(217,212,198,.4);cursor:pointer}
#run,#act{position:fixed;right:calc(18px + env(safe-area-inset-right));width:74px;height:74px;border-radius:50%;font-size:16px;letter-spacing:.08em}
#run{bottom:calc(28px + env(safe-area-inset-bottom))}#run.held{background:#d9d4c6;color:#000}
#act{bottom:calc(118px + env(safe-area-inset-bottom));display:none;border-color:#e3c46a;color:#f0dfa8;background:rgba(48,40,22,.8);font-size:14px}#act.on{display:block}
#goal{position:fixed;top:calc(var(--top,10px) + env(safe-area-inset-top));left:132px;display:none;align-items:center;gap:10px;font-size:15px;letter-spacing:.16em;padding:7px 13px;background:rgba(0,0,0,.5);border:1px solid rgba(217,212,198,.3);white-space:nowrap}
#goal span{font-size:10px;opacity:.6;letter-spacing:.3em}#goal b{font-weight:600}#goal.gate b{color:#ec8672}
#map{position:fixed;left:10px;top:calc(var(--top,10px) + env(safe-area-inset-top));width:110px;height:110px;display:none;background:rgba(0,0,0,.42);border:1px solid rgba(217,212,198,.2)}
body[data-mode="play"] #goal{display:flex}body[data-mode="play"] #map{display:block}
#pulse{position:fixed;width:28px;height:28px;margin:-14px;border:1.5px solid #e3c46a;border-radius:50%;opacity:0;pointer-events:none}
#howto{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;background:#000;padding:0 7vw;opacity:0}
body[data-mode="howto"] #howto{display:flex}
#howto h2{font-size:13px;font-weight:500;letter-spacing:.5em;opacity:.55}
#howto .lead{font-size:clamp(16px,4.6vw,21px);letter-spacing:.14em;line-height:1.9;text-align:center;filter:url(#ink1)}
#howto ul{list-style:none;display:flex;flex-direction:column;gap:1.5vh;max-width:430px;width:100%}
#howto li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(13.5px,3.7vw,16px);line-height:1.65;letter-spacing:.05em}
#howto li i{flex:none;font-style:normal;width:32px;height:32px;border:1px solid rgba(217,212,198,.55);display:flex;align-items:center;justify-content:center;font-size:16px}
#howto li:nth-child(1) i{color:#e3c46a;border-color:#8d7230}#howto li:nth-child(2) i{color:#ec8672;border-color:#8a3a2e}#howto li:nth-child(4) i{color:#cfe0e0;border-color:#6d8a8c}
#howto .ctl{font-size:12px;letter-spacing:.1em;opacity:.6;text-align:center;line-height:1.8}
#enter{padding:14px 34px;font-size:16px;letter-spacing:.4em}
#skip{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));padding:8px 14px;font-size:12px;letter-spacing:.2em;opacity:.6;display:none}
#title,#result{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;background:#000}
#title .sm{writing-mode:vertical-rl;font-size:13px;letter-spacing:.5em;opacity:.5;position:absolute;right:16%;top:20%}
#start,#again{padding:14px 34px;font-size:16px;letter-spacing:.4em}
#title p,#result p{font-size:11px;letter-spacing:.14em;opacity:.5}
#result{display:none;background:transparent;opacity:0}
#resTitle{writing-mode:vertical-rl;font-size:min(11vh,19vw);letter-spacing:.34em;font-weight:800;color:#ece6d6;filter:url(#ink3)}
#resLine{font-size:15px;letter-spacing:.2em}#resNote{font-size:12px;letter-spacing:.3em;opacity:.6}
body[data-mode="play"] #hud,body[data-mode="play"] #run{display:block}
#hud,#run{display:none}
body:not([data-mode="play"]) #act,body:not([data-mode="play"]) #joy,body:not([data-mode="play"]) #slit{display:none!important}
body[data-mode="opening"] #skip{display:block}
body[data-mode="result"] #result{display:flex}
@media (hover:hover) and (pointer:fine){#run::after{content:"Shift";display:block;font-size:9px;letter-spacing:.1em;opacity:.6}#act::after{content:"E";display:block;font-size:9px;opacity:.6}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="subs"></div><div id="opsubs"></div><div id="opmiss"></div>
<div id="bigtitle"><b>十枚目</b></div>
<div id="fearfx"></div><div id="count"></div><div id="hint"></div>
<div id="slit"><i></i><i></i></div>
<div id="hud"><div id="stam"><b></b></div><div id="keyIcon">鍵</div></div>
<div id="joy"><i></i></div>
<button id="run">走る</button><button id="act">隠れる</button>
<div id="goal"><span>目的</span><b id="goalText">鍵をさがせ</b></div><canvas id="map"></canvas><div id="pulse"></div>
<button id="skip">とばす</button>
<div id="title"><div class="sm">番町皿屋敷より</div><div class="t">十枚目</div><button id="start">はじめる</button><p>音なしでも遊べます。音ありなら、声のする方向も聞こえます</p></div>
<div id="howto"><h2>やること</h2>
<p class="lead">十枚目の皿は<br>お前の頭の上にある</p>
<ul><li><i>鍵</i><span>屋敷のどこかの床に落ちている<b>鍵</b>をさがす。ときどき、きらっと光る</span></li>
<li><i>門</i><span>鍵を持って<b>門</b>から出る。左上の地図の赤い印が門</span></li>
<li><i>皿</i><span>走ると足音で気づかれる。<b>走りすぎると皿が落ちて割れ</b>、お菊の速さが十倍になる</span></li>
<li><i>菊</i><span>画面の端に出る<b>「三枚…」の文字が、お菊のいる方向</b>。大きいほど近い</span></li>
<li><i>隠</i><span>見つかったら部屋を出るか、<b>押し入れに隠れる</b></span></li></ul>
<p class="ctl" id="ctl"></p><button id="enter">屋敷へ入る</button></div>
<div id="result"><div id="resTitle"></div><div id="resLine"></div><div id="resNote"></div><button id="again">もう一度</button><p>屋敷の間取りは、毎回変わります</p></div>
